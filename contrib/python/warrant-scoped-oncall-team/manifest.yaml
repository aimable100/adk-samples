type: "standalone"    # Options: [standalone | module]
status: "active"      # Options: [active | inactive]
language: "python"    # Options: [python | java | go | kotlin | typescript]
description: "An SRE coordinator narrows its on-call role into a ticket scoped to one service, a replica ceiling and ten minutes, bound to the remediation sub-agent's own key; every tool call is signed by that agent and verified against the full delegation chain before the tool body runs, so injected instructions to touch other services are refused."

architecture:
  agent: "multi"       # Options: [single | multi]
  stateful: false      # Options: [true | false]
  datasources:         # Options: [hardcoded | local | external]
    - "hardcoded"

dependencies:
  libraries:
    - "ADK"
    - "tenuo"
  services: []

ownership:
  team: "tenuo-ai"
  poc: "aimable100"

tags:
  - "multi-agent"
  - "authorization"
  - "least-privilege"
  - "delegation"
  - "prompt-injection"
  - "plugin"

license: "Apache-2.0"
