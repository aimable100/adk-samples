[project]
name = "warrant-scoped-oncall-team"
version = "0.1.0"
description = "On-call standing authority is narrowed into a per-alert ticket at hand-off, bound to the remediation agent's key; the fleet gateway verifies the warrant chain and proof-of-possession before any replica change."
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "google-adk>=2.9,<3",
    "google-genai>=1.9.0",
    "tenuo>=0.3.0,<0.4",
    "pydantic>=2",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
